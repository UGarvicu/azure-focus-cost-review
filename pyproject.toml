[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-focus-cost-review"
version = "0.1.0"
description = "Local, read-only cost allocation review for Azure FOCUS CSV exports"
requires-python = ">=3.10"
authors = [{name = "UGarvicu"}]

[project.scripts]
focus-cost-review = "azure_focus_cost_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
